replicaCount: 1
image:
  repository: ghcr.io/dhruvdavda777/taskboard
  tag: "1.0.0"
  pullPolicy: IfNotPresent
app:
  env: production
  logLevel: info
  owner: "Dhruv Davda"
  roll: "24BCS10203"
# Never put a real secret in values.yaml - this is the reference only.
secret:
  create: false
  existingSecret: taskboard-secret
persistence:
  enabled: true
  size: 128Mi
  storageClass: standard
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  path: /taskboard
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits:   {cpu: 400m, memory: 256Mi}
probes:
  startup:   {path: /readyz,  periodSeconds: 2,  failureThreshold: 30}
  readiness: {path: /readyz,  periodSeconds: 5}
  liveness:  {path: /healthz, periodSeconds: 10, failureThreshold: 3}
