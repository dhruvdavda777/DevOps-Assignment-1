# Argo CD syncs the final project from Git - no kubectl apply by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: taskboard, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/dhruvdavda777/DevOps-Assignment-1.git
    targetRevision: main
    path: 21_Final_DevOps_Project/kubernetes
  destination: {server: https://kubernetes.default.svc, namespace: taskboard}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
