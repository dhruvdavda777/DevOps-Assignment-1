# The desired state of the demo app, stored in Git.
# Argo CD reconciles the cluster to match THIS file - nothing is ever applied
# by hand. Change this file, commit, and the cluster follows.
# Dhruv Davda - 24BCS10203
apiVersion: v1
kind: Namespace
metadata: {name: gitops-demo}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gitops-page, namespace: gitops-demo}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>GitOps demo</title></head>
    <body style="font-family: system-ui, sans-serif; text-align:center; padding-top:60px;">
      <h1>Deployed by Argo CD from Git</h1>
      <p>Dhruv Davda &middot; 24BCS10203 &middot; Group A</p>
      <p>revision: v1</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitops-demo, namespace: gitops-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gitops-demo}
  template:
    metadata:
      labels: {app: gitops-demo}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: page
          configMap: {name: gitops-page}
---
apiVersion: v1
kind: Service
metadata: {name: gitops-demo, namespace: gitops-demo}
spec:
  selector: {app: gitops-demo}
  ports: [{port: 80, targetPort: 80, name: http}]
