# hostPath: mounts a path from the NODE's filesystem. Ties the Pod to that node
# and is a security risk (a Pod can read the host). Used by node agents only.
apiVersion: v1
kind: Pod
metadata: {name: vol-hostpath}
spec:
  nodeName: dhruv-devops-worker      # pin it, since hostPath is node-specific
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - {name: host-root, mountPath: /host-etc, readOnly: true}
  volumes:
    - name: host-root
      hostPath:
        path: /etc
        type: Directory
