# HPA demo. The app burns CPU on every request so load is easy to generate.
# Dhruv Davda - 24BCS10203
apiVersion: v1
kind: ConfigMap
metadata: {name: cpu-app-code}
data:
  app.py: |
    # Each request does a deliberately CPU-bound loop, so concurrent requests
    # drive measurable CPU usage that the HPA can react to.
    import hashlib, os, socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    ROUNDS = int(os.environ.get("ROUNDS", "180000"))

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok"
            else:
                d = b"dhruv-24bcs10203"
                for _ in range(ROUNDS):          # the CPU burn
                    d = hashlib.sha256(d).digest()
                body = f"ok {socket.gethostname()} {d.hex()[:12]}\n".encode()
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a): pass

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cpu-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-app}
  template:
    metadata:
      labels: {app: cpu-app}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/code/app.py"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: code, mountPath: /code}]
          # HPA CANNOT WORK without resources.requests - the percentage target
          # is a percentage OF THE REQUEST.
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits:   {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: code
          configMap: {name: cpu-app-code}
---
apiVersion: v1
kind: Service
metadata: {name: cpu-app}
spec:
  selector: {app: cpu-app}
  ports: [{port: 80, targetPort: 8080, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cpu-app}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-app
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50      # scale up above 50% of the 100m request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0   # react immediately (default 0)
    scaleDown:
      stabilizationWindowSeconds: 60  # shortened from the 300s default for the demo
