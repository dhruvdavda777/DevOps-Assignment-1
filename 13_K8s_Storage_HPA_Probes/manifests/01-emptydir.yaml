# emptyDir: created empty when the Pod is assigned to a node, deleted FOREVER
# when the Pod is removed. Shared between containers in the same Pod.
# Dhruv Davda - 24BCS10203
apiVersion: v1
kind: Pod
metadata: {name: vol-emptydir}
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"writer line $i at $(date +%T)\" >> /shared/log.txt; sleep 3; done"]
      volumeMounts: [{name: scratch, mountPath: /shared}]
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 10; while true; do echo '--- reader sees ---'; tail -3 /shared/log.txt; sleep 10; done"]
      volumeMounts: [{name: scratch, mountPath: /shared}]
  volumes:
    - name: scratch
      emptyDir: {}
