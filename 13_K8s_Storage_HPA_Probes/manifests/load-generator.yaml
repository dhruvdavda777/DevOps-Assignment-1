# Load generator: 6 parallel infinite request loops against the Service.
apiVersion: apps/v1
kind: Deployment
metadata: {name: load-generator}
spec:
  replicas: 6
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://cpu-app/ 2>/dev/null; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
