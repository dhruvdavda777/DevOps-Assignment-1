# volumeClaimTemplates: a StatefulSet creates ONE PVC PER POD, and reattaches
# the same PVC when a Pod is recreated with the same ordinal name.
apiVersion: v1
kind: Service
metadata: {name: sts-headless}
spec:
  clusterIP: None
  selector: {app: sts-storage}
  ports: [{port: 80, name: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: sts-storage}
spec:
  serviceName: sts-headless
  replicas: 2
  selector:
    matchLabels: {app: sts-storage}
  template:
    metadata:
      labels: {app: sts-storage}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo \"$(hostname) first wrote at $(date)\" >> /data/identity.txt; sleep 3600"]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: {storage: 64Mi}
