server {
    listen 80;
    server_name localhost;

    # Tier 1: serve the static page.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy to tier 2. "api" is the compose service name, resolved by
    # Docker's embedded DNS on the user-defined network - no IP addresses here.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
