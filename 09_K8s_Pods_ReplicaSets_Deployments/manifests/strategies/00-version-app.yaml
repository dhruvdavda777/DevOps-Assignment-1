# A tiny nginx that reports which VERSION and which Pod answered. Every strategy
# below reuses this shape, so traffic shifts are visible in the response body.
# Dhruv Davda - 24BCS10203
apiVersion: v1
kind: ConfigMap
metadata:
  name: ver-blue
data:
  default.conf: |
    server {
      listen 80;
      location / {
        return 200 "version=BLUE pod=$hostname\n";
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ver-green
data:
  default.conf: |
    server {
      listen 80;
      location / {
        return 200 "version=GREEN pod=$hostname\n";
        add_header Content-Type text/plain;
      }
    }
