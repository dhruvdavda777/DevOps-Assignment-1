# Strategy 3: Blue-Green - two complete environments run side by side. The
# Service selector is the switch: traffic is 100% blue or 100% green, never split.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: bg, version: blue}
  template:
    metadata:
      labels: {app: bg, version: blue}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: conf
          configMap: {name: ver-blue}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: bg, version: green}
  template:
    metadata:
      labels: {app: bg, version: green}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: conf
          configMap: {name: ver-green}
---
apiVersion: v1
kind: Service
metadata:
  name: bg-service
spec:
  # THIS is the cutover switch. version: blue -> all traffic to blue.
  # Patch it to green and every request moves instantly.
  selector:
    app: bg
    version: blue
  ports: [{port: 80, targetPort: 80}]
