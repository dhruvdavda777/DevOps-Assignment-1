# A DaemonSet runs exactly one Pod on every node - no replica count.
# This is the shape kube-proxy and kindnet use.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  labels:
    app: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
        owner: dhruv
    spec:
      # Without this toleration the control-plane node is off limits, because
      # kubeadm taints it. A real node agent needs to run there too.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: logger
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'while true; do echo "$(date) agent alive on node $NODE_NAME"; sleep 30; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
