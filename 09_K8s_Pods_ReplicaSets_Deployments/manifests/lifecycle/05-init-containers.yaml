# Init containers run to completion, IN ORDER, before any app container starts.
# The Pod shows Init:0/2 then Init:1/2 then PodInitializing then Running.
apiVersion: v1
kind: Pod
metadata: {name: lc-init}
spec:
  initContainers:
    - name: init-wait
      image: busybox:1.36
      command: ["sh", "-c", "echo 'init 1: waiting for a dependency'; sleep 8"]
    - name: init-setup
      image: busybox:1.36
      command: ["sh", "-c", "echo 'init 2: writing config'; echo 'ready' > /work/status; sleep 4"]
      volumeMounts: [{name: shared, mountPath: /work}]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'app started, init left:'; cat /work/status; sleep 3600"]
      volumeMounts: [{name: shared, mountPath: /work}]
  volumes:
    - name: shared
      emptyDir: {}
