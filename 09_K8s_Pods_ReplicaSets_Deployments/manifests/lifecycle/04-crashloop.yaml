# State: CrashLoopBackOff. Same failure as above, but restartPolicy Always means
# the kubelet keeps restarting it with exponential backoff (10s, 20s, 40s...).
apiVersion: v1
kind: Pod
metadata: {name: lc-crashloop}
spec:
  restartPolicy: Always
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting'; sleep 2; echo 'crashing now'; exit 1"]
