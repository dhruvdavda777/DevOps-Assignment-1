# LoadBalancer asks the cloud provider for an external load balancer.
# On kind there is no cloud provider, so this stays <pending> - see the README.
apiVersion: v1
kind: Service
metadata:
  name: whoami-lb
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
