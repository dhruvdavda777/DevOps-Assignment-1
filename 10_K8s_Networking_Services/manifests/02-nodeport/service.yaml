# NodePort opens the same port on EVERY node and forwards to the Service.
apiVersion: v1
kind: Service
metadata:
  name: whoami-nodeport
spec:
  type: NodePort
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080   # must be in 30000-32767; omit to let k8s choose
