# Applied by the CD job (image tag substituted at deploy time).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo
  labels: {app: devsecops-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: devsecops-demo}
  template:
    metadata:
      labels: {app: devsecops-demo}
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /readyz, port: 3000}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: devsecops-demo}
spec:
  selector: {app: devsecops-demo}
  ports: [{port: 80, targetPort: 3000, name: http}]
