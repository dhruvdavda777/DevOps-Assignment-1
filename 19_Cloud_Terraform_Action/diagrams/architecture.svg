<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .t     { fill: #1f2933; }
    .muted { fill: #6b7785; }
    .box   { fill: #ffffff; stroke: #c3cbd6; stroke-width: 1.5; rx: 8; }
    .vpc   { fill: #f6f9fc; stroke: #3b7dd8; stroke-width: 2; stroke-dasharray: 7 4; rx: 10; }
    .pub   { fill: #eaf5ec; stroke: #4a9c62; stroke-width: 1.5; rx: 8; }
    .priv  { fill: #fdf1e8; stroke: #d08345; stroke-width: 1.5; rx: 8; }
    .ec2   { fill: #fff6e5; stroke: #d9a441; stroke-width: 1.5; rx: 6; }
    .s3    { fill: #eef0fb; stroke: #5b6ad0; stroke-width: 1.5; rx: 6; }
    .sg    { fill: #fdecec; stroke: #c9524d; stroke-width: 1.5; rx: 6; }
    .edge  { stroke: #6b7785; stroke-width: 1.6; fill: none; }
    .lbl   { font-size: 11px; }
    .h     { font-size: 13px; font-weight: 600; }
    .title { font-size: 17px; font-weight: 700; }
  </style>

  <text x="24" y="30" class="t title">Session 19 — Terraform-provisioned AWS architecture</text>
  <text x="24" y="50" class="muted lbl">Dhruv Davda · 24BCS10203 · Group A · region ap-south-1 · 16 resources from one `terraform apply`</text>

  <!-- internet -->
  <rect x="380" y="70" width="160" height="38" class="box"/>
  <text x="460" y="94" class="t h" text-anchor="middle">Internet</text>

  <!-- igw -->
  <rect x="380" y="140" width="160" height="38" class="box"/>
  <text x="460" y="158" class="t h" text-anchor="middle">Internet Gateway</text>
  <text x="460" y="172" class="muted lbl" text-anchor="middle">aws_internet_gateway.main</text>
  <path d="M460 108 L460 140" class="edge" marker-end="url(#a)"/>

  <!-- VPC -->
  <rect x="40" y="205" width="700" height="330" class="vpc"/>
  <text x="58" y="228" class="t h">VPC  10.42.0.0/16</text>
  <text x="58" y="244" class="muted lbl">vpc-bfea7ec1 · DNS support + hostnames enabled</text>

  <!-- route table -->
  <rect x="560" y="258" width="162" height="48" class="box"/>
  <text x="641" y="277" class="t lbl" text-anchor="middle" font-weight="600">Route table (public)</text>
  <text x="641" y="293" class="muted lbl" text-anchor="middle">0.0.0.0/0 → IGW</text>
  <path d="M540 159 L740 159 L740 282 L722 282" class="edge" marker-end="url(#a)"/>

  <!-- public subnet -->
  <rect x="62" y="262" width="470" height="150" class="pub"/>
  <text x="78" y="284" class="t h">Public subnet — 10.42.1.0/24 · ap-south-1a</text>
  <text x="78" y="300" class="muted lbl">subnet-a48b15ce · map_public_ip_on_launch = true</text>

  <rect x="86" y="314" width="190" height="78" class="ec2"/>
  <text x="181" y="336" class="t lbl" text-anchor="middle" font-weight="600">EC2 web-1 · t3.micro</text>
  <text x="181" y="353" class="muted lbl" text-anchor="middle">i-4e61d8fe0acd748b9</text>
  <text x="181" y="369" class="muted lbl" text-anchor="middle">10.42.1.4</text>
  <text x="181" y="384" class="muted lbl" text-anchor="middle">user_data installs nginx</text>

  <rect x="300" y="314" width="190" height="78" class="ec2"/>
  <text x="395" y="336" class="t lbl" text-anchor="middle" font-weight="600">EC2 web-2 · t3.micro</text>
  <text x="395" y="353" class="muted lbl" text-anchor="middle">i-e3ff9ff7c1fa9501f</text>
  <text x="395" y="369" class="muted lbl" text-anchor="middle">10.42.1.5</text>
  <text x="395" y="384" class="muted lbl" text-anchor="middle">count = var.instance_count</text>

  <path d="M460 178 L460 205 L297 205 L297 262" class="edge" marker-end="url(#a)"/>

  <!-- private subnet -->
  <rect x="62" y="430" width="470" height="88" class="priv"/>
  <text x="78" y="452" class="t h">Private subnet — 10.42.11.0/24 · ap-south-1a</text>
  <text x="78" y="468" class="muted lbl">subnet-33fbec40 · no route to the internet</text>
  <text x="78" y="492" class="muted lbl">Reserved for the data tier. Reachable only from the web security group.</text>
  <text x="78" y="508" class="muted lbl">No NAT gateway in this build — see the README.</text>

  <!-- security groups -->
  <rect x="560" y="330" width="162" height="74" class="sg"/>
  <text x="641" y="350" class="t lbl" text-anchor="middle" font-weight="600">SG: web</text>
  <text x="641" y="366" class="muted lbl" text-anchor="middle">in 80, 443 ← 0.0.0.0/0</text>
  <text x="641" y="381" class="muted lbl" text-anchor="middle">in 22 ← 10.42.0.0/16</text>
  <text x="641" y="396" class="muted lbl" text-anchor="middle">egress: all</text>

  <rect x="560" y="420" width="162" height="60" class="sg"/>
  <text x="641" y="440" class="t lbl" text-anchor="middle" font-weight="600">SG: db</text>
  <text x="641" y="456" class="muted lbl" text-anchor="middle">in 5432 ← SG:web</text>
  <text x="641" y="471" class="muted lbl" text-anchor="middle">(group ref, not a CIDR)</text>

  <path d="M560 367 L492 367" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M641 404 L641 420" class="edge" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- S3 -->
  <rect x="770" y="262" width="126" height="118" class="s3"/>
  <text x="833" y="284" class="t lbl" text-anchor="middle" font-weight="600">S3 bucket</text>
  <text x="833" y="301" class="muted lbl" text-anchor="middle">dhruv-s19-assets-</text>
  <text x="833" y="314" class="muted lbl" text-anchor="middle">42b6bb6a</text>
  <text x="833" y="334" class="muted lbl" text-anchor="middle">versioning on</text>
  <text x="833" y="349" class="muted lbl" text-anchor="middle">public access</text>
  <text x="833" y="362" class="muted lbl" text-anchor="middle">fully blocked</text>
  <text x="833" y="376" class="muted lbl" text-anchor="middle">inventory.json</text>

  <path d="M740 320 L770 320" class="edge" stroke-dasharray="4 3"/>
  <text x="755" y="312" class="muted lbl" text-anchor="middle"></text>

  <!-- legend -->
  <text x="24" y="566" class="muted lbl">Dependency order is inferred from references — Terraform built VPC → IGW → subnets → route table → security groups → EC2 → S3 object,</text>
  <text x="24" y="582" class="muted lbl">and destroyed them in exactly the reverse order. Nothing in the code specifies that sequence.</text>
  <text x="24" y="604" class="muted lbl">Solid arrows = network path · dashed = association / reference</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7785"/>
    </marker>
  </defs>
</svg>
